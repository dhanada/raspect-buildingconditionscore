<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="950" cy="150" r="55" fill="#fde047" opacity="0.9"/>
  <circle cx="950" cy="150" r="80" fill="#fde047" opacity="0.15"/>
  <!-- Distant buildings -->
  <rect x="60" y="420" width="130" height="300" fill="#0f172a" opacity="0.5"/>
  <rect x="200" y="360" width="100" height="360" fill="#0f172a" opacity="0.45"/>
  <rect x="990" y="380" width="140" height="340" fill="#0f172a" opacity="0.5"/>
  <rect x="1060" y="300" width="90" height="420" fill="#0f172a" opacity="0.4"/>
  <!-- Main tower -->
  <rect x="430" y="120" width="340" height="600" fill="url(#glass)" rx="4"/>
  <rect x="430" y="120" width="340" height="18" fill="#0f766e"/>
  <rect x="430" y="702" width="340" height="18" fill="#0f766e"/>
  <!-- Vertical mullions -->
  <g stroke="#083344" stroke-width="3" opacity="0.55">
    <line x1="455" y1="138" x2="455" y2="702"/>
    <line x1="480" y1="138" x2="480" y2="702"/>
    <line x1="505" y1="138" x2="505" y2="702"/>
    <line x1="530" y1="138" x2="530" y2="702"/>
    <line x1="555" y1="138" x2="555" y2="702"/>
    <line x1="580" y1="138" x2="580" y2="702"/>
    <line x1="605" y1="138" x2="605" y2="702"/>
    <line x1="630" y1="138" x2="630" y2="702"/>
    <line x1="655" y1="138" x2="655" y2="702"/>
    <line x1="680" y1="138" x2="680" y2="702"/>
    <line x1="705" y1="138" x2="705" y2="702"/>
    <line x1="730" y1="138" x2="730" y2="702"/>
  </g>
  <!-- Horizontal floors -->
  <g stroke="#083344" stroke-width="2" opacity="0.5">
    <line x1="430" y1="168" x2="770" y2="168"/>
    <line x1="430" y1="198" x2="770" y2="198"/>
    <line x1="430" y1="228" x2="770" y2="228"/>
    <line x1="430" y1="258" x2="770" y2="258"/>
    <line x1="430" y1="288" x2="770" y2="288"/>
    <line x1="430" y1="318" x2="770" y2="318"/>
    <line x1="430" y1="348" x2="770" y2="348"/>
    <line x1="430" y1="378" x2="770" y2="378"/>
    <line x1="430" y1="408" x2="770" y2="408"/>
    <line x1="430" y1="438" x2="770" y2="438"/>
    <line x1="430" y1="468" x2="770" y2="468"/>
    <line x1="430" y1="498" x2="770" y2="498"/>
    <line x1="430" y1="528" x2="770" y2="528"/>
    <line x1="430" y1="558" x2="770" y2="558"/>
    <line x1="430" y1="588" x2="770" y2="588"/>
    <line x1="430" y1="618" x2="770" y2="618"/>
    <line x1="430" y1="648" x2="770" y2="648"/>
    <line x1="430" y1="678" x2="770" y2="678"/>
  </g>
  <!-- Glass reflections -->
  <polygon points="470,140 520,140 470,260" fill="#ffffff" opacity="0.12"/>
  <polygon points="600,300 660,300 600,520" fill="#ffffff" opacity="0.08"/>
  <!-- Crown / antenna -->
  <rect x="588" y="90" width="24" height="34" fill="#0d9488"/>
  <line x1="600" y1="30" x2="600" y2="90" stroke="#0d9488" stroke-width="5"/>
  <circle cx="600" cy="30" r="6" fill="#f87171" opacity="0.9"/>
  <!-- Street -->
  <rect x="0" y="720" width="1200" height="80" fill="url(#street)"/>
  <line x1="0" y1="730" x2="1200" y2="730" stroke="#334155" stroke-width="2" stroke-dasharray="30 20"/>
  <!-- Ground retail -->
  <rect x="430" y="640" width="340" height="80" fill="#0f766e"/>
  <rect x="445" y="655" width="70" height="55" fill="#67e8f9" opacity="0.35"/>
  <rect x="530" y="655" width="70" height="55" fill="#67e8f9" opacity="0.35"/>
  <rect x="615" y="655" width="70" height="55" fill="#67e8f9" opacity="0.35"/>
  <rect x="700" y="655" width="60" height="55" fill="#67e8f9" opacity="0.35"/>
</svg>
