<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; font-family: Inter, Arial, sans-serif; font-size: 9pt; color: #334155; }
    .footer { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-top: 1px solid #cbd5e1; }
    .footer-left { display: flex; align-items: center; gap: 10px; }
    .footer-left img { height: 18px; }
    .footer-left span { color: #0f172a; font-weight: 600; }
    .footer-right { color: #475569; }
  </style>
  <script>
    function subst() {
      var vars = {};
      var qs = document.location.search.substring(1).split("&");
      for (var i = 0; i < qs.length; i++) {
        var pair = qs[i].split("=", 2);
        vars[pair[0]] = decodeURIComponent(pair[1] || "");
      }
      var pageNodes = document.getElementsByClassName("page");
      var topageNodes = document.getElementsByClassName("topage");
      for (var j = 0; j < pageNodes.length; j++) pageNodes[j].textContent = vars.page || "";
      for (var k = 0; k < topageNodes.length; k++) topageNodes[k].textContent = vars.topage || "";
    }
  </script>
</head>
<body onload="subst()">
  <div class="footer">
    <div class="footer-left">
      <img src="file:///C:/Users/dhana_mi388iv/Documents/RaSpect/Proposals/raspect-logo.svg" alt="RaSpect logo">
      <span>RaSpect Inspectica™</span>
    </div>
    <div class="footer-right">All Rights Reserved 2026 · Page <span class="page"></span> of <span class="topage"></span></div>
  </div>
</body>
</html>
