# Render deployment config (blueprint)
# Docs: https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render -> New Blueprint -> render.yaml
services:
  - type: web
    name: raspect-buildingconditionscore-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SQLITE_PATH
        value: /var/data/raspect.db
      # Add your frontend URL(s) here, e.g.
      # - key: CORS_ORIGINS
      #   value: https://dhanada.github.io
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
