# Railway deployment config
# Docs: https://docs.railway.com/reference/config-as-code

build:
  builder: DOCKERFILE
  dockerfilePath: Dockerfile

deploy:
  startCommand: node index.js
  healthcheckPath: /api/health
  healthcheckTimeoutSec: 120
  restartPolicyType: ON_FAILURE
  restartPolicyMaxRetries: 10

# Recommended (set in Railway dashboard after first deploy):
#   PORT         -> 8080 (default)
#   SQLITE_PATH  -> /data/raspect.db  (+ attach a volume mounted at /data for persistence)
#   CORS_ORIGINS -> your GitHub Pages URL(s)
