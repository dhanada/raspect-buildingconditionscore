      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Sun glow -->
  <circle cx="600" cy="560" r="180" fill="#f59e0b" opacity="0.18"/>
