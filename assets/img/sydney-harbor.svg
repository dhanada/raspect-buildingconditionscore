<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="55%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="prom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="250" cy="150" r="50" fill="#fef3c7" opacity="0.9"/>
  <circle cx="250" cy="150" r="75" fill="#fef3c7" opacity="0.15"/>
  <!-- Sea horizon -->
  <rect x="0" y="560" width="1200" height="240" fill="url(#sea)"/>
  <ellipse cx="850" cy="620" rx="200" ry="16" fill="#fef3c7" opacity="0.25"/>
  <!-- Tower 1 (residential block) -->
  <rect x="320" y="200" width="160" height="360" fill="url(#bldg)"/>
  <!-- balconies -->
  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
    <rect x="310" y="210" width="180" height="10"/>
    <rect x="310" y="250" width="180" height="10"/>
    <rect x="310" y="290" width="180" height="10"/>
    <rect x="310" y="330" width="180" height="10"/>
    <rect x="310" y="370" width="180" height="10"/>
    <rect x="310" y="410" width="180" height="10"/>
    <rect x="310" y="450" width="180" height="10"/>
    <rect x="310" y="490" width="180" height="10"/>
    <rect x="310" y="530" width="180" height="10"/>
  </g>
  <g fill="#38bdf8">
    <rect x="330" y="225" width="55" height="20" opacity="0.7"/>
    <rect x="405" y="225" width="55" height="20" opacity="0.5"/>
    <rect x="330" y="265" width="55" height="20" opacity="0.5"/>
    <rect x="405" y="265" width="55" height="20" opacity="0.8"/>
    <rect x="330" y="305" width="55" height="20" opacity="0.7"/>
    <rect x="405" y="305" width="55" height="20" opacity="0.5"/>
    <rect x="330" y="345" width="55" height="20" opacity="0.5"/>
    <rect x="405" y="345" width="55" height="20" opacity="0.8"/>
    <rect x="330" y="385" width="55" height="20" opacity="0.8"/>
    <rect x="405" y="385" width="55" height="20" opacity="0.5"/>
    <rect x="330" y="425" width="55" height="20" opacity="0.5"/>
    <rect x="405" y="425" width="55" height="20" opacity="0.7"/>
    <rect x="330" y="465" width="55" height="20" opacity="0.7"/>
    <rect x="405" y="465" width="55" height="20" opacity="0.5"/>
    <rect x="330" y="505" width="55" height="20" opacity="0.5"/>
    <rect x="405" y="505" width="55" height="20" opacity="0.8"/>
  </g>
  <!-- Tower 2 (taller residential) -->
  <rect x="560" y="150" width="150" height="410" fill="url(#bldg2)"/>
  <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1">
    <rect x="550" y="160" width="170" height="10"/>
    <rect x="550" y="205" width="170" height="10"/>
    <rect x="550" y="250" width="170" height="10"/>
    <rect x="550" y="295" width="170" height="10"/>
    <rect x="550" y="340" width="170" height="10"/>
    <rect x="550" y="385" width="170" height="10"/>
    <rect x="550" y="430" width="170" height="10"/>
    <rect x="550" y="475" width="170" height="10"/>
    <rect x="550" y="520" width="170" height="10"/>
  </g>
  <g fill="#38bdf8">
    <rect x="570" y="175" width="50" height="22" opacity="0.8"/>
    <rect x="640" y="175" width="50" height="22" opacity="0.5"/>
    <rect x="570" y="220" width="50" height="22" opacity="0.5"/>
    <rect x="640" y="220" width="50" height="22" opacity="0.8"/>
    <rect x="570" y="265" width="50" height="22" opacity="0.7"/>
    <rect x="640" y="265" width="50" height="22" opacity="0.5"/>
    <rect x="570" y="310" width="50" height="22" opacity="0.5"/>
    <rect x="640" y="310" width="50" height="22" opacity="0.8"/>
    <rect x="570" y="355" width="50" height="22" opacity="0.8"/>
    <rect x="640" y="355" width="50" height="22" opacity="0.5"/>
    <rect x="570" y="400" width="50" height="22" opacity="0.5"/>
    <rect x="640" y="400" width="50" height="22" opacity="0.7"/>
    <rect x="570" y="445" width="50" height="22" opacity="0.7"/>
    <rect x="640" y="445" width="50" height="22" opacity="0.5"/>
    <rect x="570" y="490" width="50" height="22" opacity="0.5"/>
    <rect x="640" y="490" width="50" height="22" opacity="0.8"/>
  </g>
  <!-- Harbour edge / promenade -->
  <rect x="0" y="560" width="1200" height="26" fill="url(#prom)"/>
  <!-- Water -->
  <g stroke="#0c4a6e" stroke-width="2" opacity="0.5">
    <line x1="0" y1="610" x2="200" y2="610"/>
    <line x1="250" y1="610" x2="450" y2="610"/>
    <line x1="500" y1="610" x2="700" y2="610"/>
    <line x1="750" y1="610" x2="950" y2="610"/>
    <line x1="1000" y1="610" x2="1200" y2="610"/>
    <line x1="100" y1="650" x2="300" y2="650"/>
    <line x1="350" y1="650" x2="550" y2="650"/>
    <line x1="600" y1="650" x2="800" y2="650"/>
    <line x1="850" y1="650" x2="1050" y2="650"/>
    <line x1="0" y1="690" x2="200" y2="690"/>
    <line x1="250" y1="690" x2="450" y2="690"/>
    <line x1="500" y1="690" x2="700" y2="690"/>
    <line x1="750" y1="690" x2="950" y2="690"/>
    <line x1="1000" y1="690" x2="1200" y2="690"/>
  </g>
</svg>
