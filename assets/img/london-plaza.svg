<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Clouds -->
  <ellipse cx="250" cy="160" rx="120" ry="35" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="950" cy="220" rx="140" ry="30" fill="#ffffff" opacity="0.3"/>
  <!-- Distant towers -->
  <rect x="120" y="360" width="90" height="360" fill="#475569" opacity="0.7"/>
  <rect x="220" y="300" width="70" height="420" fill="#475569" opacity="0.6"/>
  <rect x="900" y="330" width="80" height="390" fill="#475569" opacity="0.7"/>
  <rect x="990" y="280" width="90" height="440" fill="#475569" opacity="0.6"/>
  <!-- Main tower -->
  <rect x="470" y="140" width="260" height="580" fill="url(#glass)" rx="2"/>
  <rect x="470" y="140" width="260" height="580" fill="url(#glass)" opacity="0.0"/>
  <!-- vertical mullions -->
  <g stroke="#082f49" stroke-width="2" opacity="0.5">
    <line x1="500" y1="140" x2="500" y2="720"/>
    <line x1="530" y1="140" x2="530" y2="720"/>
    <line x1="560" y1="140" x2="560" y2="720"/>
    <line x1="590" y1="140" x2="590" y2="720"/>
    <line x1="620" y1="140" x2="620" y2="720"/>
    <line x1="650" y1="140" x2="650" y2="720"/>
    <line x1="680" y1="140" x2="680" y2="720"/>
    <line x1="710" y1="140" x2="710" y2="720"/>
  </g>
  <!-- floors -->
  <g stroke="#082f49" stroke-width="1.5" opacity="0.45">
    <line x1="470" y1="175" x2="730" y2="175"/>
    <line x1="470" y1="210" x2="730" y2="210"/>
    <line x1="470" y1="245" x2="730" y2="245"/>
    <line x1="470" y1="280" x2="730" y2="280"/>
    <line x1="470" y1="315" x2="730" y2="315"/>
    <line x1="470" y1="350" x2="730" y2="350"/>
    <line x1="470" y1="385" x2="730" y2="385"/>
    <line x1="470" y1="420" x2="730" y2="420"/>
    <line x1="470" y1="455" x2="730" y2="455"/>
    <line x1="470" y1="490" x2="730" y2="490"/>
    <line x1="470" y1="525" x2="730" y2="525"/>
    <line x1="470" y1="560" x2="730" y2="560"/>
    <line x1="470" y1="595" x2="730" y2="595"/>
    <line x1="470" y1="630" x2="730" y2="630"/>
    <line x1="470" y1="665" x2="730" y2="665"/>
  </g>
  <!-- Reflection highlight -->
  <polygon points="490,140 540,140 490,400" fill="#ffffff" opacity="0.10"/>
  <polygon points="600,140 660,140 600,560" fill="#ffffff" opacity="0.07"/>
  <!-- Base / podium -->
  <rect x="450" y="640" width="300" height="80" fill="#0c4a6e"/>
  <rect x="460" y="650" width="60" height="60" fill="#7dd3fc" opacity="0.3"/>
  <rect x="535" y="650" width="60" height="60" fill="#7dd3fc" opacity="0.3"/>
  <rect x="610" y="650" width="60" height="60" fill="#7dd3fc" opacity="0.3"/>
  <rect x="685" y="650" width="50" height="60" fill="#7dd3fc" opacity="0.3"/>
  <!-- Street -->
  <rect x="0" y="720" width="1200" height="80" fill="url(#street)"/>
  <line x1="0" y1="732" x2="1200" y2="732" stroke="#334155" stroke-width="2" stroke-dasharray="30 20"/>
</svg>
